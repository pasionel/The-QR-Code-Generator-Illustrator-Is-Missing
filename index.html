<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QR Code Generator</title>
    <link rel="stylesheet" href="css/styles.css">
  </head>
  <body>
    <main class="panel">
      <div class="tabs" role="tablist" aria-label="QR content type">
        <button id="textTab" class="tab active" type="button" role="tab" aria-selected="true" aria-controls="textPanel">Text</button>
        <button id="vcardTab" class="tab" type="button" role="tab" aria-selected="false" aria-controls="vcardPanel">vCard</button>
      </div>

      <section id="textPanel" class="tabPanel active" role="tabpanel" aria-labelledby="textTab">
        <label class="field">
          <span>Text or URL</span>
          <textarea id="qrText" rows="6" placeholder="https://example.com"></textarea>
        </label>
      </section>

      <section id="vcardPanel" class="tabPanel" role="tabpanel" aria-labelledby="vcardTab">
        <div class="vcardGroup">
          <div class="groupTitle">Name</div>
          <div class="vcardGrid">
            <label class="field"><span>First name</span><input id="firstName" type="text"></label>
            <label class="field"><span>Last name</span><input id="lastName" type="text"></label>
            <label class="field"><span>Organization</span><input id="organization" type="text"></label>
            <label class="field"><span>Title</span><input id="jobTitle" type="text"></label>
          </div>
        </div>

        <div class="vcardGroup">
          <div class="groupTitle">Contact</div>
          <div class="vcardGrid">
            <label class="field"><span>Phone</span><input id="phone" type="tel"></label>
            <label class="field"><span>Email</span><input id="email" type="email"></label>
            <label class="field wide"><span>Website</span><input id="website" type="url"></label>
          </div>
        </div>

        <div class="vcardGroup">
          <div class="groupTitle">Address</div>
          <div class="vcardGrid">
            <label class="field wide"><span>Street</span><input id="street" type="text"></label>
            <label class="field"><span>City</span><input id="city" type="text"></label>
            <label class="field"><span>Region</span><input id="region" type="text"></label>
            <label class="field"><span>Postal code</span><input id="postalCode" type="text"></label>
            <label class="field"><span>Country</span><input id="country" type="text"></label>
          </div>
        </div>

        <label class="field">
          <span>vCard data</span>
          <textarea id="vcardPreview" class="codePreview" rows="6" readonly></textarea>
        </label>
      </section>

      <div class="optionsGrid">
        <label class="field">
          <span>Error correction</span>
          <select id="errorCorrection">
            <option value="M" selected>Medium</option>
            <option value="Q">Quartile</option>
            <option value="H">High</option>
          </select>
        </label>
        <label class="checkField">
          <input id="useActiveFill" type="checkbox">
          <span>Use active fill color</span>
        </label>
        <label class="field">
          <span>Output size (<span id="outputUnitLabel">pt</span>)</span>
          <input id="outputSize" type="number" min="5" max="1000" step="1" value="50">
        </label>
      </div>

      <div class="previewWrap">
        <canvas id="preview" width="220" height="220" aria-label="QR preview"></canvas>
      </div>

      <button id="insertButton" type="button">Insert QR Code</button>
      <button id="insertNewButton" class="linkButton" type="button">Insert in new document</button>
      <p id="status" role="status"></p>
    </main>

    <script src="lib/CSInterface.js"></script>
    <script src="lib/qrcode-generator.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
