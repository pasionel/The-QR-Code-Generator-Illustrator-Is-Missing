<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QR Code Generator</title>
    <link rel="stylesheet" href="css/styles.css">
  </head>
  <body>
    <main class="panel">
      <label class="field">
        <span>Text or URL</span>
        <textarea id="qrText" rows="7" placeholder="https://example.com"></textarea>
      </label>

      <div class="previewWrap">
        <canvas id="preview" width="220" height="220" aria-label="QR preview"></canvas>
      </div>

      <button id="insertButton" type="button">Insert QR Code</button>
      <p id="status" role="status"></p>
    </main>

    <script src="lib/CSInterface.js"></script>
    <script src="lib/qrcode-generator.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
